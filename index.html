<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India & World Live News Anchor</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-hover: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-light: #94a3b8;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --danger: #ef4444;
      --card-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      --dock-bg: rgba(255, 255, 255, 0.96);
    }

    [data-theme="dark"] {
      --bg: #090d16;
      --surface: #111827;
      --surface-hover: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      --border: #1f2937;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-soft: rgba(59, 130, 246, 0.15);
      --danger: #ef4444;
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      --dock-bg: rgba(17, 24, 39, 0.96);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 18px 12px 195px 12px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 12px;
      height: 12px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2);
    }

    header h1 {
      font-size: 1.45rem;
      font-weight: 800;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    .theme-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .controls-panel {
      background: var(--surface);
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn-chip {
      padding: 7px 13px;
      border: 1px solid var(--border);
      background: var(--surface-hover);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn-chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .filter-search-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .channel-select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-main);
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
      min-width: 210px;
      cursor: pointer;
    }

    .search-row {
      display: flex;
      flex: 1;
      min-width: 240px;
      gap: 8px;
    }

    .search-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-main);
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
    }

    .btn-search {
      padding: 10px 16px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      border: 2px solid var(--border);
    }

    .card.playing {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }

    .card-thumb-wrap {
      width: 100%;
      height: 160px;
      background: #1e293b;
      position: relative;
    }

    .card-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .fallback-thumb {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.74rem;
    }

    .source-tag {
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
    }

    .card-date {
      color: var(--text-light);
    }

    .card-title {
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.38;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 12px;
      flex: 1;
    }

    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-card-listen {
      background: var(--primary-soft);
      border: 1px solid var(--primary);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 700;
      color: var(--primary);
    }

    .card.playing .btn-card-listen {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .read-more {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.82rem;
    }

    .status-msg {
      text-align: center;
      padding: 40px 14px;
      color: var(--text-muted);
      grid-column: 1 / -1;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .audio-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--dock-bg);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      z-index: 100;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.1);
    }

    .dock-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dock-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .dock-status-box {
      overflow: hidden;
      flex: 1;
      min-width: 180px;
    }

    .audio-status {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
    }

    .now-playing-headline {
      font-size: 0.84rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dock-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-briefing {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-stop-big {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-nav {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .dock-settings {
      display: flex;
      gap: 8px;
    }

    .select-pill {
      flex: 1;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      font-size: 0.78rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand-wrap">
      <div class="live-dot"></div>
      <div>
        <h1>India & World Live News Anchor</h1>
        <p>National & International Channels with Studio Human Voice</p>
      </div>
    </div>
    <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>
  </header>

  <div class="controls-panel">
    <div class="btn-group" id="categoryGroup">
      <button class="btn-chip active" data-cat="india">🇮🇳 All India & World Mix</button>
      <button class="btn-chip" data-cat="all">🌍 Global Top Headlines</button>
      <button class="btn-chip" data-cat="technology">💻 Tech</button>
      <button class="btn-chip" data-cat="business">📈 Business</button>
      <button class="btn-chip" data-cat="sports">🏏 Sports</button>
      <button class="btn-chip" data-cat="entertainment">🎬 Entertainment</button>
      <button class="btn-chip" data-cat="science">🔬 Science</button>
      <button class="btn-chip" data-cat="health">🩺 Health</button>
    </div>

    <!-- Direct Channel Picker + Search Box -->
    <div class="filter-search-grid">
      <select id="channelSelect" class="channel-select" onchange="onChannelChange()">
        <option value="">📺 All News Channels (National + Intl)</option>
        <optgroup label="🇮🇳 Indian National Channels">
          <option value="indianexpress.com">📰 The Indian Express</option>
          <option value="thehindu.com">📰 The Hindu</option>
          <option value="ndtv.com">📺 NDTV News</option>
          <option value="timesofindia.indiatimes.com">📰 Times of India</option>
          <option value="hindustantimes.com">📰 Hindustan Times</option>
          <option value="livemint.com">📈 LiveMint</option>
          <option value="moneycontrol.com">💹 Moneycontrol</option>
          <option value="indiatoday.in">📺 India Today</option>
        </optgroup>
        <optgroup label="🌍 International Channels">
          <option value="bbc.co.uk,bbc.com">🇬🇧 BBC News</option>
          <option value="reuters.com">🌐 Reuters</option>
          <option value="aljazeera.com">🌍 Al Jazeera</option>
          <option value="cnn.com">🇺🇸 CNN</option>
          <option value="apnews.com">🌐 Associated Press (AP)</option>
          <option value="theguardian.com">🇬🇧 The Guardian</option>
          <option value="techcrunch.com">💻 TechCrunch</option>
        </optgroup>
      </select>

      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Search topic OR channel (e.g. Indian Express, BBC, Cricket, UPI)...">
        <button class="btn-search" onclick="triggerSearch()">Search</button>
      </div>
    </div>
  </div>

  <div class="news-grid" id="newsGrid">
    <div class="status-msg">Loading latest headlines...</div>
  </div>
</div>

<div class="audio-dock">
  <div class="dock-inner">
    <div class="dock-top">
      <div class="dock-status-box">
        <div class="audio-status" id="audioStatus">🎙 Studio Anchor Ready</div>
        <div class="now-playing-headline" id="nowPlayingTitle">Tap "Play Top 5" or any Listen button</div>
      </div>
      <div class="dock-buttons">
        <button class="btn-briefing" onclick="startBulletin()">▶ Play Top 5</button>
        <button class="btn-nav" onclick="togglePauseResume()" id="pauseBtn">⏸ Pause</button>
        <button class="btn-nav" onclick="playNext()">⏭ Next</button>
        <button class="btn-stop-big" onclick="stopAudio()">⏹ Stop Audio</button>
      </div>
    </div>

    <div class="dock-settings">
      <select id="voiceAccent" class="select-pill" onchange="restartCurrentAudio()">
        <option value="en-IN" selected>🇮🇳 Indian English Anchor (Human)</option>
        <option value="en-GB">🇬🇧 BBC British Anchor (Human)</option>
        <option value="en-US">🇺🇸 US News Anchor (Human)</option>
        <option value="en-AU">🇦🇺 Australian Anchor (Human)</option>
      </select>
      <select id="speedSelect" class="select-pill" onchange="updateSpeed(this.value)">
        <option value="0.95">0.95x Calm</option>
        <option value="1.05" selected>1.0x Normal Anchor</option>
        <option value="1.2">1.2x Fast</option>
      </select>
    </div>
  </div>
</div>

<script>
  const API_BASE = window.location.hostname.includes('vercel.app')
    ? ''
    : 'https://automatic-summaries-news.vercel.app';

  let activeCategory = 'india';
  let fetchedArticles = [];
  let fetchController = null;

  const audioPlayer = new Audio();
  let playQueue = [];
  let currentQueuePos = -1;
  let sentenceChunks = [];
  let currentChunkIndex = 0;
  let playbackSpeed = 1.05;
  let isPlaying = false;

  function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    document.getElementById('themeToggle').innerText = next === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function cleanText(txt) {
    if (!txt) return "";
    return txt
      .replace(/https?:\/\/\S+/gi, '')
      .replace(/<[^>]*>/g, '')
      .replace(/\[\+\d+\s+chars\]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function splitIntoChunks(text) {
    const words = cleanText(text).split(' ');
    const chunks = [];
    let current = '';

    for (const word of words) {
      if ((current + ' ' + word).trim().length > 175) {
        if (current) chunks.push(current.trim());
        current = word;
      } else {
        current = (current + ' ' + word).trim();
      }
    }
    if (current) chunks.push(current.trim());
    return chunks;
  }

  function highlightCard(articleIdx) {
    document.querySelectorAll('.card').forEach((card, idx) => {
      const btn = card.querySelector('.btn-card-listen');
      if (idx === articleIdx) {
        card.classList.add('playing');
        if (btn) {
          btn.innerText = '⏹ Stop';
          btn.onclick = () => stopAudio();
        }
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        card.classList.remove('playing');
        if (btn) {
          btn.innerText = '🔊 Listen';
          btn.onclick = () => readSingleArticle(idx);
        }
      }
    });
  }

  function stopAudio() {
    isPlaying = false;
    playQueue = [];
    currentQueuePos = -1;
    sentenceChunks = [];
    currentChunkIndex = 0;

    audioPlayer.pause();
    audioPlayer.removeAttribute('src');
    if (window.speechSynthesis) window.speechSynthesis.cancel();

    highlightCard(-1);
    document.getElementById('audioStatus').innerText = "🎙 Studio Anchor Stopped";
    document.getElementById('nowPlayingTitle').innerText = "Audio stopped.";
    document.getElementById('pauseBtn').innerText = "⏸ Pause";
  }

  function togglePauseResume() {
    if (!isPlaying) return;
    const pauseBtn = document.getElementById('pauseBtn');
    if (!audioPlayer.paused) {
      audioPlayer.pause();
      pauseBtn.innerText = "▶ Resume";
      document.getElementById('audioStatus').innerText = "⏸ Anchor Paused";
    } else {
      audioPlayer.play();
      pauseBtn.innerText = "⏸ Pause";
      document.getElementById('audioStatus').innerText = "🔊 Speaking Live...";
    }
  }

  function updateSpeed(val) {
    playbackSpeed = parseFloat(val) || 1.05;
    audioPlayer.playbackRate = playbackSpeed;
  }

  function restartCurrentAudio() {
    if (isPlaying && currentQueuePos !== -1) {
      playArticleAtQueuePos();
    }
  }

  function playNextChunk() {
    if (!isPlaying) return;

    if (currentChunkIndex >= sentenceChunks.length) {
      if (currentQueuePos + 1 < playQueue.length) {
        currentQueuePos++;
        playArticleAtQueuePos();
      } else {
        stopAudio();
        document.getElementById('audioStatus').innerText = "✅ Briefing Complete";
        document.getElementById('nowPlayingTitle').innerText = "Finished reading headlines.";
      }
      return;
    }

    const chunkText = sentenceChunks[currentChunkIndex];
    const accent = document.getElementById('voiceAccent').value || 'en-IN';

    audioPlayer.src = `${API_BASE}/api/tts?tl=${encodeURIComponent(accent)}&text=${encodeURIComponent(chunkText)}`;
    audioPlayer.playbackRate = playbackSpeed;

    audioPlayer.play().catch(() => {
      fallbackVoice(chunkText, accent);
    });
  }

  audioPlayer.onended = () => {
    if (!isPlaying) return;
    currentChunkIndex++;
    playNextChunk();
  };

  audioPlayer.onerror = () => {
    if (!isPlaying) return;
    const chunkText = sentenceChunks[currentChunkIndex];
    const accent = document.getElementById('voiceAccent').value || 'en-IN';
    fallbackVoice(chunkText, accent);
  };

  function fallbackVoice(text, lang) {
    if (!window.speechSynthesis) {
      stopAudio();
      return;
    }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 1.0;
    u.onend = () => {
      if (!isPlaying) return;
      currentChunkIndex++;
      playNextChunk();
    };
    window.speechSynthesis.speak(u);
  }

  function playArticleAtQueuePos() {
    const artIdx = playQueue[currentQueuePos];
    const art = fetchedArticles[artIdx];
    if (!art) {
      stopAudio();
      return;
    }

    isPlaying = true;
    highlightCard(artIdx);

    const channelName = art.source?.name ? `From ${art.source.name}. ` : '';
    const fullScript = `${channelName}${art.title}. ${art.description || ''}`;
    sentenceChunks = splitIntoChunks(fullScript);
    currentChunkIndex = 0;

    document.getElementById('audioStatus').innerText =
      playQueue.length > 1 ? `🔊 Human Anchor (${currentQueuePos + 1}/${playQueue.length})` : `🔊 Human Anchor Live`;
    document.getElementById('nowPlayingTitle').innerText = art.title;
    document.getElementById('pauseBtn').innerText = "⏸ Pause";

    playNextChunk();
  }

  function readSingleArticle(idx) {
    stopAudio();
    playQueue = [idx];
    currentQueuePos = 0;
    playArticleAtQueuePos();
  }

  function startBulletin() {
    if (!fetchedArticles.length) return;
    stopAudio();
    const limit = Math.min(5, fetchedArticles.length);
    playQueue = Array.from({ length: limit }, (_, i) => i);
    currentQueuePos = 0;
    playArticleAtQueuePos();
  }

  function playNext() {
    if (!fetchedArticles.length) return;
    if (isPlaying && currentQueuePos + 1 < playQueue.length) {
      currentQueuePos++;
      playArticleAtQueuePos();
    } else {
      const nextIdx = playQueue.length ? (playQueue[0] + 1) % fetchedArticles.length : 0;
      readSingleArticle(nextIdx);
    }
  }

  async function fetchNews(query = '') {
    stopAudio();
    if (fetchController) fetchController.abort();
    fetchController = new AbortController();

    const selectedChannel = document.getElementById('channelSelect').value;
    const grid = document.getElementById('newsGrid');
    grid.innerHTML = '<div class="status-msg">Fetching latest live headlines...</div>';

    let url = `${API_BASE}/api/news?category=${encodeURIComponent(activeCategory)}`;
    if (selectedChannel) url += `&channel=${encodeURIComponent(selectedChannel)}`;
    if (query) url += `&q=${encodeURIComponent(query)}`;

    try {
      const res = await fetch(url, { signal: fetchController.signal });
      const data = await res.json();

      if (!res.ok || data.status !== "ok" || !data.articles?.length) {
        grid.innerHTML = `<div class="status-msg">${escapeHtml(data.message) || 'No articles found for this channel or topic.'}</div>`;
        fetchedArticles = [];
        return;
      }

      fetchedArticles = data.articles.filter(a => a.title && !a.title.includes('[Removed]'));
      grid.innerHTML = '';

      fetchedArticles.forEach((art, idx) => {
        const safeSource = escapeHtml(art.source?.name || 'News');
        const safeTitle = escapeHtml(art.title);
        const safeDesc = escapeHtml(art.description || 'Tap Full Story for complete coverage.');
        const dateStr = art.publishedAt ? new Date(art.publishedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-thumb-wrap">
            ${art.urlToImage
              ? `<img src="${escapeHtml(art.urlToImage)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'fallback-thumb\\'>${safeSource}</div>'">`
              : `<div class="fallback-thumb">${safeSource}</div>`
            }
          </div>
          <div class="card-body">
            <div class="card-meta">
              <span class="source-tag">${safeSource}</span>
              <span class="card-date">${dateStr}</span>
            </div>
            <h2 class="card-title">${safeTitle}</h2>
            <p class="card-desc">${safeDesc}</p>
            <div class="card-footer">
              <button class="btn-card-listen" onclick="readSingleArticle(${idx})">🔊 Listen</button>
              <a href="${escapeHtml(art.url)}" class="read-more" target="_blank" rel="noopener">Full Story &rarr;</a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    } catch (err) {
      if (err.name === 'AbortError') return;
      grid.innerHTML = '<div class="status-msg" style="color: #ef4444;">Unable to load headlines. Make sure you push api/news.js to Vercel!</div>';
    }
  }

  document.getElementById('categoryGroup').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll('#categoryGroup button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCategory = btn.dataset.cat;
    fetchNews(document.getElementById('searchInput').value.trim());
  });

  function onChannelChange() {
    fetchNews(document.getElementById('searchInput').value.trim());
  }

  function triggerSearch() {
    const q = document.getElementById('searchInput').value.trim();
    fetchNews(q);
  }

  document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') triggerSearch();
  });

  fetchNews();
</script>
</body>
</html>
